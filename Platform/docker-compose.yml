# Одновузловий replica set для локальної розробки (транзакції працюють лише на replica set).
#   docker compose -f docker/docker-compose.yml up -d
# Рядок підключення: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7.0
    container_name: reviews-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Якщо replica set ще не ініціалізований — ініціалізуємо; інакше rs.status() проходить.
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
        | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

volumes:
  mongo-data:
