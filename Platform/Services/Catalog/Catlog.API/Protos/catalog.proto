syntax = "proto3";
package catalog;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Platform.Contracts.Catalog";

service CatalogGrpc {
  rpc GetProduct (GetProductRequest) returns (ProductInfo);
  rpc GetProductsByIds (GetProductsByIdsRequest) returns (GetProductsByIdsReply);
  rpc GetProductBySlug (GetProductBySlugRequest) returns (ProductDetailsInfo);
  rpc ListProducts (ListProductsRequest) returns (ListProductsReply);
  rpc GetTopRated (GetTopRatedRequest) returns (GetTopRatedReply);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesReply);
  rpc GetStock (GetStockRequest) returns (StockInfo);
  rpc ReserveStock (ReserveStockRequest) returns (ReservationInfo);
  rpc CommitReservation (CommitReservationRequest) returns (google.protobuf.Empty);
  rpc ReleaseReservation (ReleaseReservationRequest) returns (ReleaseReservationReply);
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductsByIdsRequest {
  // Ідентифікатори товарів (GUID), 1–100 штук.
  repeated string product_ids = 1;
}

message GetProductsByIdsReply {
  repeated ProductInfo products = 1;
  // Ідентифікатори, яких немає в каталозі.
  repeated string missing_ids = 2;
}

message GetProductBySlugRequest {
  string slug = 1;
}

message ListProductsRequest {
  // Фільтр за категорією; порожній рядок = без фільтра.
  string category_slug = 1;
  // Пошук за назвою; порожній рядок = без пошуку.
  string search = 2;
  // Лише товари, що є в наявності.
  bool in_stock_only = 3;
  // Межі ціни (десятковий рядок); відсутнє поле = без обмеження.
  optional string min_price = 4;
  optional string max_price = 5;
  ProductSortOrder sort = 6;
  // Номер сторінки з 1; 0 трактується як 1.
  int32 page = 7;
  // Розмір сторінки 1–100; 0 трактується як 20.
  int32 page_size = 8;
}

message ListProductsReply {
  repeated ProductListItemInfo items = 1;
  // Загальна кількість товарів за фільтром.
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetTopRatedRequest {
  // Кількість товарів 1–100; 0 трактується як 10.
  int32 count = 1;
}

message GetTopRatedReply {
  repeated ProductListItemInfo items = 1;
}

message ListCategoriesRequest {
  // true — лише активні категорії.
  bool active_only = 1;
}

message ListCategoriesReply {
  repeated CategoryInfo categories = 1;
}

message GetStockRequest {
  // Ідентифікатор варіанта (GUID).
  string variant_id = 1;
}

message ReserveStockRequest {
  // Замовлення, для якого створюється резерв (GUID).
  string order_id = 1;
  // Позиції резерву: 1–50, варіанти не повторюються.
  repeated ReserveStockLine lines = 2;
  // Час життя резерву в хвилинах (1–1440); відсутнє поле = типовий (15).
  optional int32 ttl_minutes = 3;
}

message CommitReservationRequest {
  string order_id = 1;
}

message ReleaseReservationRequest {
  string order_id = 1;
}

message ReleaseReservationReply {
  // Скільки позицій резерву повернуто на склад.
  int32 released = 1;
}

// ---------- моделі ----------

enum ProductSortOrder {
  PRODUCT_SORT_ORDER_NEWEST = 0;
  PRODUCT_SORT_ORDER_PRICE_ASC = 1;
  PRODUCT_SORT_ORDER_PRICE_DESC = 2;
  PRODUCT_SORT_ORDER_RATING = 3;
}

// Варіант товару (розмір/фасування) з власним SKU та ціною.
message VariantInfo {
  string variant_id = 1;
  string name = 2;
  string sku = 3;
  // Ціна варіанта (десятковий рядок).
  string price = 4;
  optional int32 weight_grams = 5;
  optional int32 servings = 6;
  // false — варіант деактивований (замовляти не можна).
  bool is_active = 7;
}

// Товар з усіма варіантами (для сервісів, що працюють за ідентифікатором).
message ProductInfo {
  string product_id = 1;
  string category_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  string image_url = 6;
  // Базова ціна (десятковий рядок).
  string base_price = 7;
  optional int32 weight_grams = 8;
  optional int32 shelf_life_hours = 9;
  bool is_active = 10;
  repeated VariantInfo variants = 11;
}

message AllergenInfo {
  string code = 1;
  string name = 2;
  // "Contains" або "MayContainTraces".
  string presence = 3;
}

// Картка товару для вітрини.
message ProductDetailsInfo {
  string product_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string image_url = 5;
  string base_price = 6;
  optional int32 weight_grams = 7;
  optional int32 shelf_life_hours = 8;
  repeated VariantInfo variants = 9;
  repeated string ingredients = 10;
  repeated AllergenInfo allergens = 11;
}

// Скорочений товар для списків.
message ProductListItemInfo {
  string product_id = 1;
  string name = 2;
  string slug = 3;
  string image_url = 4;
  string category_id = 5;
  string category_name = 6;
  string category_slug = 7;
  string base_price = 8;
  // Мінімальна й максимальна ціни серед варіантів (десятковий рядок); відсутні, якщо варіантів немає.
  optional string min_price = 9;
  optional string max_price = 10;
  int32 variant_count = 11;
  // Сумарний залишок по всіх варіантах.
  int32 total_available = 12;
  bool in_stock = 13;
  // Середній рейтинг 0–5 (десятковий рядок) і кількість відгуків.
  string avg_rating = 14;
  int32 review_count = 15;
  // Перелік алергенів одним рядком.
  string allergens = 16;
}

message CategoryInfo {
  string category_id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  int32 sort_order = 5;
  bool is_active = 6;
}

message StockInfo {
  string variant_id = 1;
  int32 quantity_available = 2;
  // Денна норма виробництва/продажу.
  int32 daily_limit = 3;
}

message ReserveStockLine {
  string variant_id = 1;
  int32 quantity = 2;
}

message ReservationInfo {
  string order_id = 1;
  // Коли резерв автоматично знімається, якщо його не підтвердять (UTC).
  google.protobuf.Timestamp expires_at = 2;
  repeated ReserveStockLine lines = 3;
}
